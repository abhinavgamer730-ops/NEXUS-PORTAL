  <body>
    <div class="nav-header">
      <a href="../../index.html" class="btn btn-slate">⬅️ PORTAL MENU</a>
      <button class="btn btn-gold" id="theme-toggle-btn" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">🌙 DARK MODE</button>
      <span style="font-family: 'Fredoka', cursive; font-size: 1.1rem; color: var(--gold);">🔢 SUDOKU LOGIC</span>
    </div>

    <div class="game-card">
      <div class="sudoku-header">
        <h1 class="sudoku-title">SUDOKU</h1>

        <!-- Active Mode Badge -->
        <div id="mode-badge" class="mode-badge">
          DIFFICULTY: EASY 🟢
        </div>
      </div>

      <div class="sudoku-grid" id="grid"></div>

      <div class="numpad">
        <button class="num-btn" data-num="1">1</button>
        <button class="num-btn" data-num="2">2</button>
        <button class="num-btn" data-num="3">3</button>
        <button class="num-btn" data-num="4">4</button>
        <button class="num-btn" data-num="5">5</button>
        <button class="num-btn" data-num="6">6</button>
        <button class="num-btn" data-num="7">7</button>
        <button class="num-btn" data-num="8">8</button>
        <button class="num-btn" data-num="9">9</button>
        <button class="num-btn erase" data-num="0">✖ ERASE</button>
      </div>

      <div style="display: flex; gap: 0.5rem; width: 100%;">
        <button class="btn btn-gold" id="btn-new" style="flex: 1;">🔄 NEW GAME / SETTINGS</button>
        <button class="btn btn-cyan" id="btn-check" style="flex: 1;">✓ CHECK</button>
      </div>

      <!-- Start Screen Modal Overlay -->
      <div id="start-overlay" class="modal-overlay">
        <div class="modal-content">
          <h2 class="modal-title">🔢 SUDOKU PUZZLE</h2>
          <p class="modal-desc">Select puzzle difficulty to start!</p>

          <div class="diff-selector">
            <button class="diff-btn active" data-diff="easy" id="btn-diff-easy">EASY 🟢</button>
            <button class="diff-btn" data-diff="medium" id="btn-diff-med">MED 🟡</button>
            <button class="diff-btn" data-diff="hard" id="btn-diff-hard">HARD 🔴</button>
          </div>

          <div class="rules-list">
            <div>🔢 <strong>Grid Rules:</strong> Fill 9x9 grid with numbers 1 to 9</div>
            <div>🚫 <strong>No Repeats:</strong> Each row, column & 3x3 box must contain 1-9 without duplicates</div>
          </div>

          <button class="btn btn-gold modal-btn" id="btn-start">🚀 START PUZZLE NOW</button>
        </div>
      </div>
    </div>

    <script src="./sudoku.js"></script>
