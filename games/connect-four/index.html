    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <body>
    <!-- Top Navigation Header -->
    <header class="nav-header">
      <a href="../../index.html" class="btn btn-slate" aria-label="Return to Nexus Portal">⬅️ PORTAL MENU</a>
      <div class="nav-actions">
        <button class="btn btn-sound" id="sound-toggle-btn" aria-label="Toggle Sound Effects">🔊</button>
        <button class="btn btn-gold" id="theme-toggle-btn" aria-label="Toggle Theme">🌙 DARK</button>
      </div>
    </header>

    <!-- Main Game Container -->
    <main class="game-container">
      <div class="game-card">
        <h1 class="game-title">FOUR IN A ROW</h1>

        <!-- Mode & Difficulty Selection Bar -->
        <div class="controls-panel">
          <div class="mode-select-group">
            <button class="mode-pill active" id="btn-mode-bot" data-mode="bot">🤖 VS BOT</button>
            <button class="mode-pill" id="btn-mode-2p" data-mode="2p">👥 2 PLAYERS</button>
          </div>

          <div class="difficulty-select-group" id="difficulty-group">
            <label for="difficulty-select" class="sr-only">Bot Difficulty</label>
            <select id="difficulty-select" class="select-pill" aria-label="Select AI Difficulty">
              <option value="easy">🟢 Easy</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="hard">🔴 Master</option>
            </select>
          </div>
        </div>

        <!-- Scoreboard -->
        <div class="scoreboard">
          <div class="score-box player-1" id="score-box-p1">
            <div class="player-disc disc-red"></div>
            <div class="player-info">
              <span class="player-name" id="name-p1">PLAYER 1</span>
              <span class="player-score" id="score-p1">0</span>
            </div>
          </div>

          <div class="score-box tie-box">
            <span class="tie-label">DRAWS</span>
            <span class="tie-score" id="score-draws">0</span>
          </div>

          <div class="score-box player-2" id="score-box-p2">
            <div class="player-disc disc-yellow"></div>
            <div class="player-info">
              <span class="player-name" id="name-p2">BOT (AI)</span>
              <span class="player-score" id="score-p2">0</span>
            </div>
          </div>
        </div>

        <!-- Status Banner / Turn Indicator -->
        <div class="status-banner" id="status-banner" role="status" aria-live="polite">
          <span class="status-icon" id="status-icon">🔴</span>
          <span class="status-text" id="status-text">PLAYER 1'S TURN</span>
        </div>

        <!-- Game Board Container -->
        <div class="board-wrapper">
          <!-- Column Hover Drop Guides (Desktop) -->
          <div class="column-indicators" id="column-indicators" aria-hidden="true">
            <div class="indicator" data-col="0"></div>
            <div class="indicator" data-col="1"></div>
            <div class="indicator" data-col="2"></div>
            <div class="indicator" data-col="3"></div>
            <div class="indicator" data-col="4"></div>
            <div class="indicator" data-col="5"></div>
            <div class="indicator" data-col="6"></div>
          </div>

          <!-- 7x6 Connect 4 Grid -->
          <div class="connect-grid" id="connect-grid" role="grid" aria-label="Connect Four Game Board">
            <!-- 42 slots generated dynamically by game.js -->
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="game-actions">
          <button class="btn btn-action btn-undo" id="btn-undo" title="Undo last move" aria-label="Undo move">↩️ UNDO</button>
          <button class="btn btn-action btn-restart" id="btn-restart" title="Restart current match" aria-label="Restart game">🔄 RESTART</button>
          <button class="btn btn-action btn-reset-score" id="btn-reset-score" title="Reset score" aria-label="Reset score counter">🧹 CLEAR SCORE</button>
        </div>
      </div>
    </main>

    <script src="./game.js"></script>
