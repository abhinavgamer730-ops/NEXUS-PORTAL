    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Memory Card Match",
      "url": "https://abhinavgamer730-ops.github.io/NEXUS-PORTAL/games/memory-match/",
      "operatingSystem": "Web Browser",
      "applicationCategory": "GameApplication",
      "genre": "Puzzle / Memory Training",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "featureList": ["3D Card Flip Animations", "3 Difficulty Levels", "Timer & Move Counter", "Best Record Tracking", "Match Combo Streaks"]
    }
    </script>

    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script src="../../theme-toggle.js"></script>
    <link rel="icon" type="image/jpeg" href="../../logo.jpg" />
  </head>
  <body>
    <!-- Top Navigation Header -->
    <header class="nav-header">
      <a href="../../index.html" class="btn btn-slate" aria-label="Return to Nexus Portal">⬅️ PORTAL MENU</a>
      <div class="nav-actions">
        <button class="btn btn-sound" id="sound-toggle-btn" aria-label="Toggle Sound Effects">🔊</button>
        <button class="btn btn-gold" id="theme-toggle-btn" aria-label="Toggle Theme">🌙 DARK</button>
      </div>
    </header>

    <!-- Main Game Container -->
    <main class="game-container">
      <div class="game-card">
        
        <h1 class="game-title">MEMORY MATCH</h1>

        <!-- Mode Selection Tabs -->
        <div class="mode-selector-group" role="tablist" aria-label="Game Mode">
          <button class="mode-pill active" data-mode="solo" role="tab" aria-selected="true">👤 Solo</button>
          <button class="mode-pill" data-mode="bot" role="tab" aria-selected="false">🤖 vs Bot</button>
          <button class="mode-pill" data-mode="2p" role="tab" aria-selected="false">👥 2 Players</button>
        </div>

        <!-- Controls & Difficulty Bar -->
        <div class="controls-panel">
          <div class="difficulty-group">
            <button class="diff-pill" data-diff="easy">🟢 Easy (12)</button>
            <button class="diff-pill active" data-diff="medium">🟡 Medium (16)</button>
            <button class="diff-pill" data-diff="hard">🔴 Hard (20)</button>
          </div>

          <div class="theme-select-group">
            <label for="theme-select" class="sr-only">Card Theme</label>
            <select id="theme-select" class="select-pill" aria-label="Select Card Theme">
              <option value="animals" selected>🐱 Animals</option>
              <option value="food">🍕 Food &amp; Treats</option>
              <option value="arcade">🎮 Arcade &amp; Gems</option>
            </select>
          </div>
        </div>

        <!-- Dynamic Turn Banner for Bot & 2P Modes -->
        <div class="turn-banner" id="turn-banner" style="display: none;">
          <div class="turn-badge" id="turn-badge">
            <span class="turn-icon" id="turn-icon">👤</span>
            <span class="turn-text" id="turn-text">YOUR TURN</span>
          </div>
        </div>

        <!-- Live Scoreboard & Stats (Adaptive for Solo, Bot, and 2P) -->
        <div class="stats-bar" id="stats-bar">
          <div class="stat-box" id="stat-box-1">
            <span class="stat-label" id="stat-label-1">MOVES</span>
            <span class="stat-val" id="stat-val-1">0</span>
          </div>

          <div class="stat-box" id="stat-box-2">
            <span class="stat-label" id="stat-label-2">TIME</span>
            <span class="stat-val" id="stat-val-2">00:00</span>
          </div>

          <div class="stat-box" id="stat-box-3">
            <span class="stat-label" id="stat-label-3">PAIRS</span>
            <span class="stat-val" id="stat-val-3">0/8</span>
          </div>

          <div class="stat-box best-box" id="stat-box-4">
            <span class="stat-label" id="stat-label-4">BEST</span>
            <span class="stat-val" id="stat-val-4">-</span>
          </div>
        </div>

        <!-- Combo Streak Banner -->
        <div class="combo-banner" id="combo-banner">
          🔥 COMBO x<span id="combo-multiplier">2</span>!
        </div>

        <!-- Card Grid Stage -->
        <div class="grid-wrapper">
          <div class="card-grid grid-medium" id="card-grid" role="grid" aria-label="Memory Card Matching Grid">
            <!-- Dynamic cards generated by game.js -->
          </div>
        </div>

        <!-- Bottom Action Bar -->
        <div class="game-actions">
          <button class="btn btn-action btn-restart" id="btn-restart" aria-label="Restart Game">🔄 NEW GAME</button>
          <button class="btn btn-action btn-peek" id="btn-peek" title="Briefly peek all cards" aria-label="Peek Hint">💡 HINT PEEK</button>
        </div>

      </div>
    </main>

    <!-- Victory / Game Over Modal Overlay -->
    <div class="victory-modal" id="victory-modal" style="display: none;">
      <div class="modal-card">
        <div class="modal-hero-icon" id="modal-hero-icon">🏆</div>
        <h2 class="modal-title" id="modal-title">GREAT MEMORY!</h2>
        <p class="modal-desc" id="modal-desc">You matched all cards successfully!</p>
        
        <div class="modal-stats-grid" id="modal-stats-grid">
          <div class="modal-stat-item">
            <span id="modal-label-1">Total Moves</span>
            <strong id="modal-val-1">0</strong>
          </div>
          <div class="modal-stat-item">
            <span id="modal-label-2">Time Taken</span>
            <strong id="modal-val-2">00:00</strong>
          </div>
          <div class="modal-stat-item">
            <span id="modal-label-3">Best Moves</span>
            <strong id="modal-val-3">0</strong>
          </div>
        </div>

        <p class="modal-toast" id="modal-new-best" style="display: none;">🎉 NEW BEST RECORD!</p>
        <button class="btn btn-gold btn-modal-play" id="btn-modal-restart">▶️ PLAY AGAIN</button>
      </div>
    </div>

    <script src="./game.js"></script>
  </body>
</html>
