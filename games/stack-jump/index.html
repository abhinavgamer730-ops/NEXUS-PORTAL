      "url": "https://abhinavgamer730-ops.github.io/NEXUS-PORTAL/games/stack-jump/",

      "applicationCategory": "GameApplication",

    <link rel="stylesheet" href="./style.css" />

  <body>
    <!-- Top Navigation Bar -->
    <header class="nav-header">
      <a href="../../index.html" class="btn btn-slate" aria-label="Return to Nexus Portal">⬅️ PORTAL MENU</a>
      <div class="nav-actions">
        <button class="btn btn-sound" id="sound-toggle-btn" aria-label="Toggle Sound Effects">🔊</button>
        <button class="btn btn-gold" id="theme-toggle-btn" aria-label="Toggle Theme">🌙 DARK</button>
      </div>
    </header>

    <!-- Main Game Container -->
    <main class="game-container">
      <div class="game-card">
        
        <!-- Live HUD (Current Score & High Score) -->
        <div class="game-hud">
          <div class="hud-item score-item">
            <span class="hud-label">SCORE</span>
            <span class="hud-val" id="current-score">0</span>
          </div>

          <!-- Combo Multiplier Toast -->
          <div class="combo-badge" id="combo-badge">PERFECT! x2</div>

          <div class="hud-item best-item">
            <span class="hud-label">BEST</span>
            <span class="hud-val" id="best-score">0</span>
          </div>
        </div>

        <!-- Canvas Game Stage -->
        <div class="canvas-wrapper" id="canvas-wrapper">
          <canvas id="game-canvas" width="400" height="580" aria-label="Stack Jump Game Canvas"></canvas>

          <!-- Start Screen Overlay -->
          <div class="game-overlay start-overlay" id="start-overlay">
            <div class="overlay-content">
              <div class="overlay-hero-icon">🐥🧱</div>
              <h1 class="overlay-title">STACK JUMP</h1>
              <p class="overlay-desc">Tap or press <strong>SPACE</strong> to jump onto sliding blocks and build your tower!</p>
              <button class="btn btn-gold btn-play-main" id="btn-start-game">▶️ TAP TO PLAY</button>
            </div>
          </div>

          <!-- Game Over Overlay -->
          <div class="game-overlay gameover-overlay" id="gameover-overlay" style="display: none;">
            <div class="overlay-content">
              <div class="overlay-icon">💥</div>
              <h2 class="overlay-title">GAME OVER</h2>
              <div class="final-score-box">
                <div class="final-score-item">
                  <span>SCORE</span>
                  <strong id="final-score">0</strong>
                </div>
                <div class="final-score-item">
                  <span>BEST</span>
                  <strong id="final-best">0</strong>
                </div>
              </div>
              <p class="new-best-toast" id="new-best-toast" style="display: none;">🎉 NEW HIGH SCORE!</p>
              <button class="btn btn-gold btn-play-main" id="btn-restart-game">🔄 PLAY AGAIN</button>
            </div>
          </div>
        </div>

        <!-- Quick Controls Helper -->
        <div class="controls-hint">
          <span>👆 Tap anywhere on screen or press <strong>SPACE / UP ARROW</strong> to jump</span>
        </div>

      </div>
    </main>

    <script src="./game.js"></script>
